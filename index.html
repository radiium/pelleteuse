<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pelleteuse</title>
    </head>
    <body>
        <div id="ui">
            <b>CLAVIER</b><br />
            Z / ↑ &nbsp; Avancer<br />
            S / ↓ &nbsp; Reculer<br />
            Q / ← &nbsp; Tourner gauche<br />
            D / → &nbsp; Tourner droite<br />
            <br />
            <b>BRAS</b><br />
            I &nbsp; Lever le bras<br />
            K &nbsp; Baisser le bras<br />
            J &nbsp; Étendre le bras<br />
            L &nbsp; Replier le bras<br />
            U &nbsp; Godet haut<br />
            O &nbsp; Godet bas<br />
            <br />
            <b>CAMÉRA</b><br />
            Souris + clic droit &nbsp; Orbite
        </div>
        <div id="gamepad-indicator">🎮 Manette : non détectée</div>

        <div id="app"></div>
        
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
